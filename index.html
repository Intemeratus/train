<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Intemeratus Train</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07142a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Train">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#07142a;--card:#0f2547;--card2:#132d55;--line:#1d3a66;--gold:#c9a227;--text:#eef2f8;--mut:#8fa3c2;--ok:#4cc38a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overscroll-behavior:none}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);background:#091a33}
header b{letter-spacing:.14em;font-size:13px;color:var(--gold)}
header span{font-weight:700;font-size:17px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 28px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
nav.tabs{display:flex;border-top:1px solid var(--line);background:#091a33;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;padding:13px 0 12px;background:none;border:0;color:var(--mut);font:600 14px inherit;font-family:inherit}
nav.tabs button.on{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
h2{margin:6px 0 10px;font-size:22px}h2 small{font-size:14px;color:var(--mut);font-weight:500;margin-left:6px}
h3{margin:18px 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 12px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pill{background:var(--gold);color:#07142a;font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px;letter-spacing:.05em}
.wkbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wkbar .lbl{flex:1;text-align:center;font-weight:700}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:600 15px inherit;font-family:inherit}
.btn.gold{background:var(--gold);color:#07142a;border-color:var(--gold)}
.btn.red{color:#ff8c8c}
.btn.sq{width:44px;padding:0;font-size:20px}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.prog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.prog .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.prog b{font-size:20px}
.trk{height:9px;background:#0a1d3a;border-radius:9px;overflow:hidden;flex:1}
.trk div{height:100%;background:var(--gold);border-radius:9px}
.trk.ok div{background:var(--ok)}
.days{display:flex;gap:6px;margin-bottom:12px}
.d{flex:1;position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 0 6px;text-align:center;color:var(--text);font-family:inherit}
.d i{display:block;font-style:normal;font-size:11px;color:var(--mut)}
.d b{font-size:16px}
.d.sel{background:var(--gold);color:#07142a;border-color:var(--gold)}.d.sel i{color:#07142a}
.d.today{box-shadow:0 0 0 2px #ffffff55}
.d.dn::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.it{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.chk{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;font-size:22px;font-weight:800;font-family:inherit}
.it.done .chk{background:var(--ok);border-color:var(--ok);color:#06210f}
.mid{flex:1;min-width:0}
.nm{font-weight:700}.it.done .nm{color:var(--mut)}
.tg{font-size:14px;color:var(--mut)}
.set,.act{display:flex;align-items:center;gap:6px;margin-top:7px;color:var(--mut);font-size:14px}
.set i{width:18px;font-style:normal;text-align:center}
input,select,textarea{font:16px inherit;font-family:inherit;color:var(--text);background:#091a33;border:1px solid var(--line);border-radius:10px;padding:0 10px;min-height:42px;max-width:100%}
.set input,.act input{width:72px;text-align:center}
textarea{width:100%;padding:10px;min-height:84px;margin-top:4px}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--mut)}.stat b{font-size:21px}.stat small{color:var(--mut);font-size:13px}
.brow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.brow .l{width:34px;color:var(--mut)}.brow .v{width:78px;text-align:right;color:var(--mut)}
.hist{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;color:var(--text);font-family:inherit;font-size:15px}
.pi{display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.pi input,.pi select{min-height:40px}
.pi .nmi{flex:1 1 100%}.pi .n2{width:70px;text-align:center}.pi .rep{width:80px;text-align:center}.pi .notei{flex:1 1 100%}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.fld input{width:90px;text-align:center}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><b>INTEMERATUS</b><span>Train</span></header>
<main id="view"></main>
<nav class="tabs">
  <button data-act="tab" data-t="day">Day</button>
  <button data-act="tab" data-t="week">Week</button>
  <button data-act="tab" data-t="plan">Plan</button>
  <button data-act="tab" data-t="data">Data</button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
